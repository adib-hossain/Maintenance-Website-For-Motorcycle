<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Parts Maintenance</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <header></header>
    <main>
        <section class="Initial_Info">
            <div class="gridCol1">
                <div class="flexContainer">
                    <h2 class="bike_name">Honda Shine</h2>
                    <h3 class="milage">Current Milage: <span class="mileage_value">5000</span> km</h3>
                </div>
                <div class="flexContainer">
                    <h3 class="last_service">Last Service: <span class="service_date">20-05-2026</span></h3>
                    <h3 class="next_service">Next Service: <span class="next_service_date">20-05-2027</span></h3>
                </div>
                
            </div>
            <div class="gridCol2"></div>
            <div class="gridCol3">
                <img src="https://www.bdhonda.com/assets/public/images/sp-125/gpccW8CD05GWuJ5.png" alt="" class="standard_image">
            </div>
        </section>
        <section class="Bike_condition">
            <div class="card margin_top">
                <div class="gridColCard">
                    <img src="https://ridermagazine.com/wp-content/uploads/2019/05/Chains-Stacked.jpg" alt="" class="standard_card_image">
                </div>
                <div class="gridColCard">
                    <h3 class="part_name">Chain</h3>    
                    <h3 class="remaining_milage">Remaining Milage: <span class="remaining_milage_value">1000</span> km</h3>     
                </div>
                <div class="gridColCard">
                    <h4 class="last_changed_milage">Last Changed: <span class="change_milage">1025km</span></h4>
                    <h4 class="last_changed_date">Last Changed: <span class="change_date">20-05-2026</span></h4>
                    <h4 class="next_change_milage">Next Change: <span class="next_change_milage">2025km</span></h4>
                    <h4 class="next_change_date">Next Change: <span class="next_change_date">20-05-2027</span></h4>
                </div>
            </div>
            <div class="card margin_top"></div>
            <div class="card margin_top"></div>
            <div class="card margin_top"></div>
        </section>
        <section class="conclusion margin_top"></section>
    </main>
    <footer></footer>

    <script src="script.js"></script>
</body>

</html>
